name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Every seeded problem's expected output is checked against a working
      # reference solution. A wrong expectation ships an unsolvable problem.
      - name: Verify seed data
        run: pnpm verify:seed

      - name: Verify seed cross-references
        run: pnpm verify:refs

      # Applies every migration, the seed twice, and the invariant suite to a
      # real Postgres. RLS policies and triggers cannot be typechecked.
      - name: Verify database schema and invariants
        run: pnpm verify:db

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://codenation.local
